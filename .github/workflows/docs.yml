    branches: [main, master, develop]
  pull_request:

jobs:
  readme-guard:
    name: Cek README package (non-placeholder, namespace benar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan scripts/check-readme.sh
        run: bash scripts/check-readme.sh
